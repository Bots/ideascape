<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore IdeaScape concept previews and signal which ideas you would like to see happen. No payment or commitment."
    />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        let savedTheme = null;
        try {
          savedTheme = window.localStorage.getItem("ideascape.theme");
        } catch {
          // System preference still works when browser storage is unavailable.
        }

        const isDark =
          savedTheme === "dark" ||
          (savedTheme !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);

        if (isDark) {
          document.documentElement.classList.add("dark");
        }
        document.documentElement.style.colorScheme = isDark ? "dark" : "light";
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", isDark ? "#050505" : "#ffffff");
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Ideascape — Test the possibility</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
