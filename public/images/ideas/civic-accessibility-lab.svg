<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Cross Academy Alive</title>
  <desc id="desc">A wheelchair user times a permitted crossing demonstration on Academy Boulevard while observers record safety evidence.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd6a3"/><stop offset="1" stop-color="#fb7b36"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#25120c" flood-opacity=".35"/></filter>
    <pattern id="grain" width="29" height="29" patternUnits="userSpaceOnUse"><circle cx="7" cy="8" r="1" fill="#fff" opacity=".16"/><circle cx="22" cy="20" r="1" fill="#40180f" opacity=".1"/></pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#sky)"/>
  <path d="M0 225 130 154l95 56 160-118 112 83 120-105 130 104 143-91 110 91 120-58v206H0Z" fill="#7c3d2b" opacity=".28"/>
  <text x="65" y="78" font-family="Arial, sans-serif" font-size="49" font-weight="900" fill="#2b1711">CROSS ACADEMY ALIVE</text>
  <text x="68" y="117" font-family="monospace" font-size="20" font-weight="800" fill="#7c2d12">MEASURE THE CROSSING • FORCE THE FIX</text>
