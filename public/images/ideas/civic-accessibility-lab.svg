  <path d="M0 312h1200M0 610h1200" stroke="#fef3c7" stroke-width="10" stroke-dasharray="55 45" opacity=".75"/>
  <g fill="#fff7ed" transform="skewX(-12)"><rect x="298" y="252" width="78" height="423"/><rect x="440" y="252" width="78" height="423"/><rect x="582" y="252" width="78" height="423"/><rect x="724" y="252" width="78" height="423"/></g>
  <rect x="50" y="161" width="410" height="78" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="7" filter="url(#shadow)"/>
  <text x="255" y="210" font-family="monospace" font-size="27" font-weight="900" text-anchor="middle" fill="#7c2d12">ACADEMY BLVD</text>
  <g transform="translate(835 138)" filter="url(#shadow)">
