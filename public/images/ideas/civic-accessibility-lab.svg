    <text x="126" y="60" font-family="monospace" font-size="18" font-weight="800" text-anchor="middle" fill="#fdba74">CROSSING TIME</text>
    <text x="126" y="137" font-family="monospace" font-size="67" font-weight="900" text-anchor="middle" fill="#fff7ed">00:19</text>
  </g>
  <g transform="translate(130 352)" filter="url(#shadow)">
    <circle cx="100" cy="62" r="39" fill="#9a4c32"/>
    <path d="M92 106v111l80 58" fill="none" stroke="#fff7ed" stroke-width="23" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m92 151 75 9 47-58" fill="none" stroke="#fff7ed" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="157" cy="230" r="76" fill="none" stroke="#f97316" stroke-width="18"/>
    <circle cx="157" cy="230" r="12" fill="#f97316"/>
  </g>
