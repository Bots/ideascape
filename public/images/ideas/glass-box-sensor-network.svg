      <text x="86" y="113" font-size="18" font-weight="700" fill="#0f766e">TEMP 31°</text>
      <text x="86" y="140" font-size="12" font-weight="700" fill="#7c2d12">AUDIO: NONE</text>
      <circle cx="86" cy="188" r="20" fill="#2dd4bf"/>
      <text x="86" y="227" font-size="11" font-weight="700" fill="#fff7ed">CALIBRATED ✓</text>
