  <path d="M40 430h790v112H40z" fill="#fed7aa"/>
  <path d="M40 430h790" stroke="#fb923c" stroke-width="10"/>
  <g fill="#3b1d15" opacity=".14"><rect x="72" y="148" width="150" height="282"/><rect x="648" y="174" width="142" height="256"/><path d="M278 430V215l82-64 82 64v215z"/></g>
  <g fill="none" stroke="#ff6b2c" stroke-width="6" stroke-dasharray="12 12"><path d="M205 310Q435 156 664 310"/><path d="M205 310Q435 448 664 310"/></g>
