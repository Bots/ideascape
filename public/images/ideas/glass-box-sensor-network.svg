<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 580" role="img" aria-labelledby="title desc">
  <title id="title">Glass Box Sensor Network</title>
  <desc id="desc">Transparent neighborhood sensor pods display active measurements, calibration state, and raw-data expiry in public.</desc>
